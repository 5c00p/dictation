[project]
name = "voicetype"
version = "0.1.0"
description = "System-wide speech-to-text dictation for Windows (RU/BE) with global hotkeys and clipboard injection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "pynput>=1.7.7",
    "pystray>=0.19.5",
    "pillow>=10.0",
    "pyperclip>=1.9.0",
    "pydantic>=2.6",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.scripts]
voicetype = "voicetype.__main__:main"

[project.optional-dependencies]
cloud = [
    "openai>=1.0",
    "requests>=2.31",
]
build = [
    "pyinstaller>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicetype"]

[tool.uv]
# faster-whisper pulls ctranslate2 + onnxruntime; CPU wheels are fine here (no CUDA GPU on target).
